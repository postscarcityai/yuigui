<title>Yui motion player</title>
<style>html,body{margin:0;height:100%;background:#0b0813;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{display:block;width:100%;height:100%}</style>
<canvas id="cv"></canvas>
<script src="kit.js"></script>
<script src="geo-data.js"></script>
<script>
// Yui motion player v2 (MOTION-1; spec/MOTION.md). One canvas, one film clock, one pure function:
// draw(T) renders the film at time T from scene code written against kit.js. Scenes arrive as the
// model writes them, then end(). The clock runs from the first scene and holds at the end of what is
// known until the next scene lands. It runs in two homes, same file:
//   iframe on the site: postMessage in ({scene,end,pause,seek,replay,still,theme}), out via parent.postMessage
//   WKWebView in the app: window.yui.scene/end/pause/seek/replay/still/theme, out via webkit.messageHandlers.yui
// Out verbs: ready, first-frame, error {scene,message}, stall, slow {ms}, ended, time {t,total,paused},
// need-three (a scene calls api.three(); host answers {three:"<src>"} / yui.three(src)), timeline {total,scenes,ended}, cues {scene,cues:[{text,from,to}]} in film time, tap {id?}.
// No network (CSP; the app adds a content rule list), no storage.
(function () {
  var cv = document.getElementById("cv"), c = cv.getContext("2d");
  var snap = document.createElement("canvas"), sc = snap.getContext("2d");
  var dpr = Math.min(2, window.devicePixelRatio || 1), W = 390, H = 844;
  var api = makeMotionKit(c, {}), snapApi = makeMotionKit(sc, {});
  var native = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.yui);
  function out(m) {
    try { if (native) window.webkit.messageHandlers.yui.postMessage(m); else parent.postMessage(m, "*"); } catch (e) {}
  }
  var send = function (name, extra) { var o = { motion: name }; if (extra) for (var k in extra) o[k] = extra[k]; out(o); };
  function size(w, h) {
    W = w || cv.clientWidth || window.innerWidth; H = h || cv.clientHeight || window.innerHeight;
    cv.width = snap.width = Math.round(W * dpr); cv.height = snap.height = Math.round(H * dpr);
    api.size(W, H, dpr); snapApi.size(W, H, dpr);
  }
  window.addEventListener("resize", function () { size(); dirty = true; }); size();

  var scenes = [], ended = false, clock = 0, total = 0, paused = false, still = false, sentFirst = false, stalled = false, doneSent = false;
  var last = 0, errored = {}, theme = null, dirty = true, slowFor = 0, slowSent = false, lastTime = -1, filmLook = null, hits = [];
  var FADE = 0.6, INK = "#0b0813";
  // real three.js behind api.three(): lazy (the host sends the source only when a scene's code asks for it),
  // offline, and free when unused. One shared WebGL canvas; every scene that asks gets its own THREE.Scene.
  var threeLib = null, threeAsked = false, glCv = null, glR = null, curCtx = null, curName = "", T3 = {};
  function needThree() { if (!threeLib && !threeAsked) { threeAsked = true; send("need-three"); } }
  function loadThree(src) {
    if (threeLib) return;
    try { threeLib = new Function(String(src) + "\nreturn THREE;")(); dirty = true; }
    catch (e) { send("error", { scene: "three", message: String((e && e.message) || e) }); threeLib = false; dirty = true; }
  }
  function threeFor(a) {
    var THREE = threeLib; if (!THREE) throw new Error("api.three(): three.js is not loaded");
    var st = T3[curName];
    if (!st) {
      st = T3[curName] = { built: false, drew: false, used: false, ctx: null, camera: new THREE.PerspectiveCamera(45, W / H, 0.1, 200), scene: new THREE.Scene() };
      st.camera.position.set(0, 0, 5);
      st.once = function (fn) { if (!st.built) { st.built = true; fn(st); } };
      st.color = function (n) { return new THREE.Color(a.pal[n] || n); };
      st.draw = function () {
        if (!glR) { glCv = document.createElement("canvas"); glR = new THREE.WebGLRenderer({ canvas: glCv, alpha: true, antialias: true, premultipliedAlpha: true }); glR.setPixelRatio(1); glR.setClearColor(0x000000, 0); }
        if (glCv.width !== cv.width || glCv.height !== cv.height) glR.setSize(cv.width, cv.height, false);
        st.camera.aspect = W / H; st.camera.updateProjectionMatrix();
        glR.render(st.scene, st.camera);
        st.drew = true; st.ctx.drawImage(glCv, 0, 0, W, H);
      };
      st.THREE = THREE;
    }
    st.used = true; st.ctx = curCtx; return st;
  }
  function runScene(s, t, ctx, a) {
    curCtx = ctx; curName = s.name; var st = T3[s.name]; if (st) { st.drew = false; st.used = false; }
    s.fn(t, ctx, a);
    st = T3[s.name]; if (st && st.used && !st.drew) st.draw();
  }
  [api, snapApi].forEach(function (a) { a.three = function () { return threeFor(a); }; });
  function compile(s) { try { return new Function("t", "c", "api", s.code); } catch (e) { return null; } }
  function sceneAt(T) { for (var i = scenes.length - 1; i >= 0; i--) if (T >= scenes[i].start) return i; return 0; }
  function drawScene(i, t, ctx, a, keepHits) {
    var s = scenes[i]; if (!s) return;
    a.frame(); a.fill("ink"); a.frame();
    try { ctx.save(); runScene(s, Math.max(0, Math.min(s.dur, t)), ctx, a); ctx.restore(); }
    catch (e) { try { ctx.restore(); } catch (e2) {} if (!errored[s.name]) { errored[s.name] = 1; send("error", { scene: s.name, message: String((e && e.message) || e) }); } }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.setLineDash([]);
    drawCaps(ctx, a, t);
    var h = a.takeHits(); if (keepHits) hits = h;
  }
  function drawCaps(ctx, a, t) {
    var caps = a.takeCaps();
    for (var i = 0; i < caps.length; i++) {
      var k = caps[i]; if (t < k.from || t > k.to) continue;
      var al = Math.min(1, Math.max(0, Math.min((t - k.from) / 0.45, (k.to - t) / 0.45))); al = al * al * (3 - 2 * al);
      var size = (k.o.size || 28), yy = typeof k.o.y === "number" ? k.o.y : k.o.y === "top" ? 96 : k.o.y === "mid" ? H / 2 : H - 118;
      ctx.save(); ctx.globalAlpha = al; ctx.font = "800 " + size + "px ui-rounded, system-ui, -apple-system, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      var words = k.text.split(" "), lines = [], ln = "";
      for (var j = 0; j < words.length; j++) { var test = ln ? ln + " " + words[j] : words[j]; if (ctx.measureText(test).width > W - 56 && ln) { lines.push(ln); ln = words[j]; } else ln = test; }
      lines.push(ln);
      var lh = size * 1.2;
      for (var q = 0; q < lines.length; q++) {
        var y2 = yy - (lines.length - 1 - q) * lh + (1 - al) * 10;
        ctx.lineWidth = 7; ctx.lineJoin = "round"; ctx.strokeStyle = a.light ? "rgba(255,255,255,.9)" : "rgba(8,5,16,.85)"; ctx.strokeText(lines[q], W / 2, y2);
        ctx.fillStyle = k.o.c ? a.col(k.o.c) : a.pal.fg; ctx.fillText(lines[q], W / 2, y2);
      }
      ctx.restore();
    }
  }
  function renderAt(T) {
    if (!scenes.length) return false;
    var i = sceneAt(T), s = scenes[i], t = T - s.start;
    drawScene(i, t, c, api, true);
    if (i > 0 && t < FADE) {
      var k = t / FADE; k = k * k * (3 - 2 * k);
      drawScene(i - 1, scenes[i - 1].dur, sc, snapApi, false);
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1 - k; c.drawImage(snap, 0, 0); c.restore();
    }
    return true;
  }
  function wait(now) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = (theme && theme.ink) || INK; c.fillRect(0, 0, cv.width, cv.height); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var k = (Math.sin(now / 420) + 1) / 2; c.strokeStyle = "rgba(255,107,139," + (0.25 + 0.4 * k) + ")"; c.lineWidth = 2; c.beginPath(); c.arc(W / 2, H / 2, 16 + k * 8, 0, 6.2832); c.stroke();
  }
  function timeline() { send("timeline", { total: +total.toFixed(2), scenes: scenes.length, ended: ended }); }
  function loop(now) {
    requestAnimationFrame(loop);
    var raw = last ? now - last : 0, dt = Math.min(0.1, raw / 1000); last = now;
    if (!scenes.length) { wait(now); return; }
    var gate = null; if (!threeLib) for (var gi = 0; gi < scenes.length; gi++) if (scenes[gi].three && threeLib !== false) { gate = scenes[gi]; break; }
    if (gate && clock >= gate.start && !still) { wait(now); return; }
    if (!paused && !still) {
      var next = clock + dt; if (gate && next > gate.start) next = gate.start;
      if (next >= total) { next = total; if (ended) { if (!doneSent) { doneSent = true; send("ended"); } } else if (!stalled) { stalled = true; send("stall"); } }
      else if (stalled) stalled = false;
      if (next !== clock) dirty = true; clock = next;
    }
    if (still && clock !== total) { clock = total; dirty = true; }
    if (clock !== lastTime && (!window.__pT || now - window.__pT > 120)) { window.__pT = now; lastTime = clock; send("time", { t: +clock.toFixed(2), total: +total.toFixed(2), paused: paused }); }
    if (!dirty && !(window.__always)) return;
    dirty = !paused && !still ? true : false;
    renderAt(clock);
    if (!sentFirst) { sentFirst = true; send("first-frame"); }
    if (!paused && !still && raw > 50) { slowFor += raw; if (slowFor >= 2000 && !slowSent) { slowSent = true; send("slow", { ms: Math.round(raw) }); } } else slowFor = 0;
  }
  // cues: run a scene on a scratch canvas and collect the api.say calls, so a narrator can speak them ahead of the clock
  function probe(s) {
    if (!sentFirst) { setTimeout(function () { probe(s); }, 120); return; }
    var k = document.createElement("canvas"); k.width = Math.round(W * dpr); k.height = Math.round(H * dpr);
    var kc = k.getContext("2d"), ka = makeMotionKit(kc, {}); ka.size(W, H, dpr); ka.three = function () { return threeFor(ka); }; if (theme) ka.theme(theme);
    var seen = {}, list = [];
    for (var t = 0; t <= s.dur + 1e-6; t += 0.25) {
      ka.frame(); ka.fill("ink");
      try { kc.save(); runScene(s, Math.min(t, s.dur), kc, ka); kc.restore(); } catch (e) { break; }
      ka.takeCaps().forEach(function (q) { var key = q.text + "|" + q.from.toFixed(1); if (!seen[key]) { seen[key] = 1; list.push({ text: q.text, from: +(s.start + q.from).toFixed(2), to: +(s.start + q.to).toFixed(2) }); } });
    }
    send("cues", { scene: s.name, cues: list });
  }
  function add(o) {
    if (!o || typeof o.code !== "string") return;
    var code = o.code, m = /api\.look\(\s*['"]([a-z]+)['"]/.exec(code);
    if (m && !filmLook) filmLook = m[1]; else if (!m && filmLook) code = "api.look('" + filmLook + "');\n" + code;
    var s = { name: String(o.name || "scene"), dur: Math.max(0.5, +o.dur || 5), code: code, start: total };
    s.fn = compile(s); s.three = /api\.three\s*\(/.test(code); if (s.three) needThree();
    if (!s.fn) { send("error", { scene: s.name, message: "scene does not parse" }); s.fn = function () {}; }
    scenes.push(s); total += s.dur; stalled = false; dirty = true; timeline();
    setTimeout(function () { probe(s); }, 0);
  }
  var Y = {
    scene: add,
    end: function () { ended = true; timeline(); },
    pause: function (b) { paused = !!b; dirty = true; send("time", { t: +clock.toFixed(2), total: +total.toFixed(2), paused: paused }); },
    seek: function (t) { clock = Math.max(0, Math.min(total, +t || 0)); if (clock < total) { doneSent = false; stalled = false; } dirty = true; lastTime = -1; },
    replay: function () { clock = 0; paused = false; doneSent = false; stalled = false; dirty = true; lastTime = -1; },
    still: function (b) { still = !!b; dirty = true; },
    three: loadThree,
    theme: function (t) { theme = t; api.theme(t); snapApi.theme(t); document.body.style.background = (t && t.ink) || INK; dirty = true; }
  };
  window.yui = Y;
  window.addEventListener("message", function (e) {
    var d = e.data; if (!d || e.source !== parent) return;
    if (d.theme) Y.theme(d.theme);
    if (typeof d.three === "string") loadThree(d.three);
    if (d.scene) add(d.scene);
    if (d.end) Y.end();
    if (d.pause !== undefined) Y.pause(d.pause);
    if (d.still !== undefined) Y.still(d.still);
    if (typeof d.seek === "number") Y.seek(d.seek);
    if (d.replay) Y.replay();
  });
  cv.addEventListener("pointerup", function (e) {
    var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, id = null, best = 1e9;
    hits.forEach(function (h) { var d = Math.hypot(h.x - x, h.y - y); if (d <= h.r + 14 && d < best) { best = d; id = h.id; } });
    send("tap", id === null ? {} : { id: id });
  });
  // headless hook: scrub and sample without a clock
  window.__motion = {
    add: add, loadThree: loadThree, threeLoaded: function () { return !!threeLib; }, end: function () { ended = true; }, theme: Y.theme,
    renderAt: function (t) { clock = t; paused = true; return renderAt(t); }, total: function () { return total; },
    scenes: function () { return scenes.map(function (s) { return { name: s.name, dur: s.dur, start: s.start }; }); },
    cues: function () { return api.cues; }, errors: function () { return Object.keys(errored); }
  };
  requestAnimationFrame(loop);
  send("ready");
})();
</script>
