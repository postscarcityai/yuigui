<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yui motion harness</title>
<style>html,body{margin:0;height:100%;background:#0e0a18;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:manipulation}</style>
<canvas id="cv"></canvas>
<script>
// The hybrid motion harness (spec/MOTION.md, prototype C). The page owns the canvas, the clock, the
// camera, captions and tap targets. The model writes only scene(t, c, api); the parent posts it in.
// It runs in a sandboxed iframe (opaque origin) under a CSP that allows no network.
const cv = document.getElementById("cv"), c = cv.getContext("2d");
const DUR = 30;
let scene = null, t0 = 0, hits = [], caps = [], failed = false, sentFirst = false, ripple = null;
const dpr = Math.min(2, devicePixelRatio || 1);
// The scene draws on a fixed 390 x 420 stage, scaled to fit whatever the iframe is.
const LW = 390, LH = 420;
let sc = 1, ox = 0, oy = 0;
function size() {
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  sc = Math.min(cv.clientWidth / LW, cv.clientHeight / LH);
  ox = (cv.clientWidth - LW * sc) / 2; oy = (cv.clientHeight - LH * sc) / 2;
}
const base = () => c.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
addEventListener("resize", size); size();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const api = {
  w: LW, h: LH,
  ease, clamp, lerp: (a, b, k) => a + (b - a) * k,
  seg: (t, a, b) => clamp((t - a) / (b - a)),
  noise: (x) => { const i = Math.floor(x), f = x - i; return hash(i) + (hash(i + 1) - hash(i)) * (f * f * (3 - 2 * f)); },
  cam(cx, cy, z) { const w = LW, h = LH; base(); c.translate(w / 2, h / 2); c.scale(z, z); c.translate(-(w / 2 + cx), -(h / 2 + cy)); },
  caption(text, from, to) { caps.push({ text, from, to }); },
  hit(id, x, y, r) { hits.push({ id, x, y, r }); },
};
function drawCaptions(t) {
  base();
  for (const k of caps) {
    if (t < k.from || t > k.to) continue;
    const a = Math.min(clamp((t - k.from) / 0.4), clamp((k.to - t) / 0.4));
    c.globalAlpha = ease(a); c.fillStyle = "#f6eef7"; c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = 8;
    c.font = "700 22px system-ui, -apple-system, sans-serif"; c.textAlign = "center";
    c.fillText(k.text, api.w / 2, api.h - 26 + (1 - ease(a)) * 8, api.w - 32);
    c.shadowBlur = 0; c.globalAlpha = 1;
  }
  caps = [];
}
function frame(now) {
  if (!scene || failed) return;
  const t = Math.min(DUR, (now - t0) / 1000);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.shadowBlur = 0;
  c.fillStyle = "#0e0a18"; c.fillRect(0, 0, cv.width, cv.height);
  base();
  hits = [];
  try { c.save(); scene(t, c, api); c.restore(); drawCaptions(t); }
  catch (e) { failed = true; parent.postMessage({ motion: "error", message: String((e && e.message) || e) }, "*"); return; }
  if (ripple) {
    const k = (now - ripple.at) / 500;
    if (k < 1) { base(); c.strokeStyle = "rgba(246,238,247," + (1 - k) * 0.7 + ")"; c.lineWidth = 2; c.beginPath(); c.arc(ripple.x, ripple.y, 10 + k * 40, 0, 7); c.stroke(); } else ripple = null;
  }
  if (!sentFirst) { sentFirst = true; parent.postMessage({ motion: "first-frame" }, "*"); }
  if (t < DUR) requestAnimationFrame(frame); else parent.postMessage({ motion: "ended" }, "*");
}
function start(code) {
  failed = false; sentFirst = false;
  try { scene = new Function("t", "c", "api", code); } catch (e) { parent.postMessage({ motion: "error", message: String(e.message) }, "*"); return; }
  t0 = performance.now(); requestAnimationFrame(frame);
}
addEventListener("message", (e) => { if (e.source === parent && e.data && typeof e.data.code === "string") start(e.data.code); });
cv.addEventListener("pointerdown", (e) => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - ox) / sc, y = (e.clientY - r.top - oy) / sc;
  const h = hits.find((q) => Math.hypot(q.x - x, q.y - y) <= q.r);
  if (h) { ripple = { x, y, at: performance.now() }; parent.postMessage({ motion: "tap", id: h.id }, "*"); }
});
parent.postMessage({ motion: "ready" }, "*");
</script>
