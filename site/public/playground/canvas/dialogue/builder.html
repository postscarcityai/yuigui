<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beats: any reply, cut into beats</title>
<meta name="description" content="Paste any agent reply, plain text or Yui Lines, and see the beats the voice speaks and the anchors the screen pins.">
<style>
/* DLG-2: the beat builder (site/lib/yl/beats.mjs) on any reply. The prototype that plays beats is DLG-3. */
:root{--ink:#0b0813;--fg:#f6eef7;--dim:#a095b8;--line:#3d3460;--accent:#ff6b4a;--panel:#18132b;--you:#2a2246}
:root.light{--ink:#fbf6f1;--fg:#2b2233;--dim:#7d7290;--line:#e3d9e8;--accent:#ff5a7a;--panel:#ffffff;--you:#f1e8f3}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font:16px/1.45 ui-rounded,system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--accent);margin:0 0 2px}
.lede{color:var(--dim);font-size:14px;margin:0 0 14px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
nav button{flex:1 1 30%;padding:8px 6px;border:2px solid var(--line);border-radius:999px;background:none;color:var(--fg);font:700 14px ui-rounded,system-ui,sans-serif;cursor:pointer}
nav button.on{border-color:var(--accent);color:var(--accent)}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);padding:10px 12px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.sum{color:var(--dim);font-size:13px;font-weight:700;margin:12px 0 10px}
.ledger{margin:0 0 14px;padding:12px 16px;border-radius:16px;border:2px dashed var(--line)}
.ledger p{margin:2px 0;font-weight:800;color:var(--accent)}
.ledger p.old{opacity:.55}
.ledger small{font-weight:600;color:var(--dim)}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:30px 1fr;gap:10px;margin:0 0 10px}
.t{color:var(--dim);font:700 12px ui-monospace,Menlo,monospace;padding-top:11px;text-align:right}
.b{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.spoken{margin:0;font-size:17px}
.spoken::before{content:"\201C"}.spoken::after{content:"\201D"}
.quiet{margin:0;color:var(--dim);font-size:14px;font-style:italic}
.pin{margin:8px 0 0;font-weight:800;color:var(--accent);font-size:15px}
.tag{display:inline-block;margin:8px 6px 0 0;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:700}
.wait{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wait b{width:100%;font-size:14px}
.wait span{border:2px solid var(--accent);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;color:var(--accent)}
.wait span.in{background:var(--accent);color:var(--ink)}
.wait em{font-size:12px;color:var(--dim);font-style:normal;width:100%}
.end{margin:12px 0 0;padding:10px 14px;border-radius:16px;background:var(--you);font-size:14px}
.err{color:var(--accent);font-size:13px;font-weight:700}
a{color:var(--accent)}
.foot{margin:22px 0 0;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Beats: any reply</h1>
<p class="lede">Paste what an agent sends, plain text or Yui Lines. The voice speaks the beats; the screen pins only the anchors.</p>
<nav id="nav" aria-label="Examples"></nav>
<label for="in" class="sum">The reply</label>
<textarea id="in" spellcheck="false" aria-label="The reply"></textarea>
<p class="sum" id="sum" aria-live="polite"></p>
<div class="ledger" id="ledger" hidden><p class="sum" style="margin:0 0 6px">Pinned on screen</p></div>
<ol id="beats"></ol>
<div id="end"></div>
<p class="foot">The rules: <a href="https://github.com/postscarcityai/yuigui/blob/main/docs/plans/dialogue-stage.md#4-the-model">the plan, section 4</a>. The code: <a href="https://github.com/postscarcityai/yuigui/blob/main/site/lib/yl/beats.mjs">beats.mjs</a>. Three scripted conversations: <a href="index.html">the scripts</a>.</p>
</main>
<script type="module">
import { beats, WAIT_AFTER } from "../yl/beats.mjs";
const Q = new URLSearchParams(location.search);
if (Q.get("theme") === "light" || (!Q.get("theme") && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.classList.add("light");
// Each example is a reply as an agent sends it today. "follows" is the reply before it, so ids and anchors carry over.
const EX = {
  text: { name: "Plain text", reply: "The heart is two pumps, side by side. The right side sends blood to the lungs. The left side sends it to the body, which needs more pressure.\n\nThat is why the left wall is thicker." },
  status: { name: "A status", reply: "Build 160 is on TestFlight.\n\nStatus: green\nMemory: no leaks\n\n- Barge-in: in test\n- Guide rewrite: not started" },
  mixed: { name: "Text and lines", reply: "Three runs this week, all dry.\n```yui\nshapes \"This week\"\nshape@tue box \"Tue 5k\"\nshape@sat box \"Sat 12k\"\nsay \"Saturday is the long one.\"\nchoose@when \"Morning or evening?\" Morning|Evening\nsay \"I will set the alarm either way.\"\n```" },
  heart: { name: "Heart, marked", reply: "say \"The heart is two pumps, side by side.\"\nanchor \"Two pumps\"\nshapes \"Your heart\"\nshape@ra blob \"right atrium\"\nshape@left bracket from=8.4,1.6 to=8.4,6 label=\"Left side\"\nsay \"The right side takes blood from the body and sends it to the lungs.\"\nanchor \"Right side: body to lungs\" sub=\"low pressure\"\n~ra tone=lavender +fill" },
  follow: { name: "Heart, follow-up", follows: "heart", reply: "say \"Because the lungs need low pressure and the body needs high pressure.\"\nanchor \"Two pressures: lungs low, body high\"\nchart bar \"Pressure\" x=Lungs|Body y=25|120 unit=mmHg\nsay \"Want me to carry on with the left side?\"\n~left tone=accent +pulse\nwait@go \"Carry on with the left side?\" \"Left side\"|\"Ask something\" +in" },
  deck: { name: "A deck", reply: "deck \"What changed\"\npage \"Plain words\" body=\"Cards say what they are. No ids anywhere.\"\npage \"One idea a page\" body=\"Each page holds one thought, so it reads from across the room.\"\nend\nplan@before \"Before I go\"\nchoose@ping \"Ping you when it ships?\" Yes|No\nend" },
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const input = document.getElementById("in"), nav = document.getElementById("nav");
let pick = EX[Q.get("ex")] ? Q.get("ex") : "text";
for (const k in EX) {
  const b = el("button", k === pick ? "on" : "", EX[k].name); b.type = "button"; b.dataset.ex = k;
  b.onclick = () => { pick = k; for (const x of nav.children) x.classList.toggle("on", x.dataset.ex === k); input.value = EX[k].reply; draw(); };
  nav.append(b);
}
input.value = EX[pick].reply;
input.oninput = () => { for (const x of nav.children) x.classList.remove("on"); pick = null; draw(); };
function draw() {
  const prev = pick && EX[pick].follows ? beats(EX[EX[pick].follows].reply) : null;
  const r = beats(input.value, { prev });
  const list = document.getElementById("beats"), led = document.getElementById("ledger"), end = document.getElementById("end");
  list.replaceChildren(); end.replaceChildren();
  led.replaceChildren(led.firstElementChild); led.hidden = !r.anchors.length;
  for (const a of r.anchors) { const p = el("p", a.beat < 0 ? "old" : "", a.text); if (a.sub) p.append(" ", el("small", "", a.sub)); if (a.beat < 0) p.append(" ", el("small", "", "from before")); led.append(p); }
  const marked = r.anchors.some((a) => a.marked && a.beat >= 0);
  const fresh = r.anchors.filter((a) => a.beat >= 0).length;
  document.getElementById("sum").textContent = `${r.beats.length} beat${r.beats.length === 1 ? "" : "s"}, ${fresh} new anchor${fresh === 1 ? "" : "s"}` + (r.beats.length ? (marked ? ". Marked by the agent." : ". Inferred from the reply.") : "");
  r.beats.forEach((b, i) => {
    const li = el("li"), box = el("div", "b");
    li.append(el("div", "t", String(i + 1)));
    box.append(b.line ? el("p", "spoken", b.line) : el("p", "quiet", "Shows, says nothing."));
    if (b.anchor) box.append(el("p", "pin", "Pins: " + b.anchor.text));
    if (b.pic) box.append(el("span", "tag", "picture: " + b.pic.preset));
    if (b.patch) box.append(el("span", "tag", `${b.patch.length} change${b.patch.length === 1 ? "" : "s"} to the picture`));
    if (b.wait) {
      const w = b.wait, d = el("div", "wait");
      d.append(el("b", "", "Waits: " + (w.q || "Go on?")));
      for (const o of w.options) d.append(el("span", w.marks && w.marks[o] ? "in" : "", o));
      d.append(el("em", "", w.into ? "Filled options are parts of the picture: tap the part, or say it." : w.bare ? `Nobody talks, it goes on after ${WAIT_AFTER} s.` : "The flow stops here until you answer."));
      box.append(d);
    }
    li.append(box); list.append(li);
  });
  if (r.questions.length) end.append(el("div", "end", `${r.plan ? `"${r.plan.title || "The plan"}"` : "A form"}: ${r.questions.length} question${r.questions.length === 1 ? "" : "s"} on one screen after the last beat.`));
  for (const e of r.errors) end.append(el("p", "err", e));
  window.__beats = { beats: r.beats.length, anchors: r.anchors.length };
}
draw();
</script>
</body>
</html>
