<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/kit.css"><link rel="stylesheet" href="../lab.css">
<style>
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .tile { transform-origin: 0 0; border-radius: 0; }
  .napkinBg { background-color: #FBF8F1; background-image: repeating-linear-gradient(0deg, transparent 0 46px, rgba(0,0,0,.035) 46px 48px), repeating-linear-gradient(90deg, transparent 0 46px, rgba(0,0,0,.035) 46px 48px); }
</style></head>
<body><div id="stage"></div>
<script type="module">
// Yui brand lab, the journey: sketch, the clean cut, ink, stone, glaze, cloth, pop, a napkin cat, all of them, one mark.
import { shaderLayer, inkLayer, cap, label, inOut, ready, SCENES, byId, landPose, wink, landTimes, ease, prog, mix, clamp, REEL, W, H, Q, SPEC } from "../lab.js";
import { drift } from "../../../site/lib/brand/scenes.mjs";
import { B, SCENE, LAND, WINK, DURATION, BPM } from "./score.js";
import CH from "./chapters.json" with { type: "json" };

const stageEl = document.getElementById("stage");
const within = (t, k, pad = 0) => t >= B(SCENE[k][0]) - pad && t < B(SCENE[k][1]) + pad;
const S0 = (k) => B(SCENE[k][0]), S1 = (k) => B(SCENE[k][1]);

// ---- layers, back to front
const L = {
  paper: shaderLayer("paper"), meok: shaderLayer("meok"), quiet: shaderLayer("quiet"),
  celadon: shaderLayer("celadon"), bojagi: shaderLayer("bojagi"), holo: shaderLayer("holo"),
};
const napkinBg = document.createElement("div"); napkinBg.className = "layer napkinBg"; stageEl.appendChild(napkinBg);
const ink = inkLayer({ fill: "#1D1B20", pad: REEL ? 0.1 : 0.16 });
const NS = ink.NS;
// the construction grid for the clean cut
const grid = document.createElementNS(NS, "g");
grid.setAttribute("stroke", "#E2552F"); grid.setAttribute("stroke-width", "2.2"); grid.setAttribute("fill", "none");
ink.back.appendChild(grid);
const V = [SPEC.stemX, SPEC.top + SPEC.W * 0.3], phi = SPEC.earAngle * Math.PI / 180;
const gl = [[-60, SPEC.base, 1060, SPEC.base], [-60, SPEC.xh, 1060, SPEC.xh], [SPEC.stemX, -60, SPEC.stemX, 660],
  [V[0], V[1], V[0] - Math.sin(phi) * 520, V[1] - Math.cos(phi) * 520], [V[0], V[1], V[0] + Math.sin(phi) * 520, V[1] - Math.cos(phi) * 520]]
  .map(([x1, y1, x2, y2]) => { const l = document.createElementNS(NS, "line"); Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v)); const len = Math.hypot(x2 - x1, y2 - y1); l.setAttribute("stroke-dasharray", len); l.dataset.len = len; grid.appendChild(l); return l; });
// the napkin's pen: whiskers and eyes
const pen = document.createElementNS(NS, "g");
pen.innerHTML = '<path d="M226 384 l-96 -16 M226 404 l-98 4 M406 384 l68 -12 M406 404 l70 2" /><circle cx="272" cy="352" r="9" /><circle cx="360" cy="352" r="9" />';
pen.setAttribute("stroke", "#2B3A67"); pen.setAttribute("stroke-width", "6"); pen.setAttribute("stroke-linecap", "round"); pen.setAttribute("fill", "#2B3A67");
ink.front.appendChild(pen);
const fade = document.createElement("div"); fade.id = "fade"; stageEl.appendChild(fade);

const C = {
  six: cap("Six pieces of paper.", "high", "#3B2A25"),
  cut: cap("One clean cut.", "high", "#1D1B20"),
  ink: cap("Ink.", "high", "#1E1B1A"),
  stone: cap("Stone.", "high", "#3B3835"),
  glaze: cap("Glaze.", "high", "#2F4A40"),
  cloth: cap("Cloth.", "high", "#2F4A40"),
  pop: cap("A little pop.", "high", "#2A1F3D"),
  cat: cap("If you squint, a cat.", "high", "#2B3A67"),
  which: cap("Which one is Yui?", "high", "#1D1B20"),
};
const url = label("yuigui.com/brand", "r", "#1D1B20");
const round = label("Brand lab, round 1", "l", "#1D1B20");

// ---- the six tiles for the finale: each material, settled, shrunk into a grid
const TILE_ORDER = ["paper", "meok", "quiet", "celadon", "bojagi", "holo"];
function tileBox(i) {
  const cols = REEL ? 2 : 3, rows = REEL ? 3 : 2, gap = REEL ? 28 : 32, m = REEL ? 60 : 120;
  const top = REEL ? 440 : 170, bottom = REEL ? 420 : 110;
  const tw = (W - m * 2 - gap * (cols - 1)) / cols, th = (H - top - bottom - gap * (rows - 1)) / rows;
  const s = Math.min(tw / W, th / H);
  const cw = W * s, chh = H * s;
  const c = i % cols, r = Math.floor(i / cols);
  const x0 = (W - (cols * cw + (cols - 1) * gap)) / 2, y0 = top + ((H - top - bottom) - (rows * chh + (rows - 1) * gap)) / 2;
  return { x: x0 + c * (cw + gap), y: y0 + r * (chh + gap), s };
}
function place(el, x, y, s, r = 0) { el.style.transformOrigin = "0 0"; el.style.transform = `translate(${x}px, ${y}px) scale(${s})`; el.style.borderRadius = `${r / s}px`; }
function unplace(el) { el.style.transform = ""; el.style.borderRadius = ""; }

// settled looks, used by the tiles
const settled = {
  paper: (t) => ({ ...SCENES.paper(t, null, { land: false }), p: [0.5, 1, 0, 0] }),
  meok: (t) => ({ ...SCENES.meok(t, null, { once: true }), p: [1, 0.45, 1, 0] }),
  quiet: (t) => SCENES.quiet(t, null),
  celadon: (t) => ({ ...SCENES.celadon(t, null), p: [1, (t * 0.2) % 1.3 - 0.15, 0, 0] }),
  bojagi: (t) => SCENES.bojagi(t, null),
  holo: (t) => SCENES.holo(t, null),
};
const padFor = (k) => ({ place: { pad: REEL ? 0.1 : 0.16 } });

function show(k, o) { L[k].show(o); }

function renderAt(t) {
  for (const k in L) { L[k].show(0); unplace(L[k].el); }
  napkinBg.style.opacity = 0; ink.show(0); grid.style.opacity = 0; pen.style.opacity = 0;
  stageEl.style.background = "#FFFFFF";

  // 1. the sketch: paper pieces land and drift, then the drift stills for the match cut
  if (t < S1("sketch") + 1) {
    const sc = SCENES.paper(t, null);
    const still = 1 - prog(t, S1("sketch") - 1.4, S1("sketch") - 0.2);
    sc.mark.pose = t < LAND.sketch + 2.5 ? landPose(t - LAND.sketch) : drift(t, 4 * still * prog(t, LAND.sketch + 1.6, LAND.sketch + 2.8));
    sc.place = padFor().place;
    L.paper.draw(t, sc);
    show("paper", 1 - ease.inOut(prog(t, S1("sketch") - 0.3, S1("sketch") + 0.5)));
  }
  // 2. the clean cut: the same six shapes, now vector, from cocoa to ink as the dial turns
  if (within(t, "dial", 0.6)) {
    const a = S0("dial");
    const r = 1 - ease.inOut(prog(t, a + 0.6, a + 3.8));
    const col = prog(t, a - 0.2, a + 0.8);
    ink.set({ rough: r, round: 0.5 }, col < 0.5 ? "#9E6153" : "#1D1B20");
    ink.show(Math.min(ease.out(prog(t, a - 0.3, a + 0.2)), 1 - prog(t, S1("dial") - 0.1, S1("dial") + 0.5)));
    grid.style.opacity = 1 - prog(t, S1("dial") - 0.8, S1("dial") - 0.2);
    gl.forEach((l, i) => l.setAttribute("stroke-dashoffset", l.dataset.len * (1 - ease.inOut(prog(t, a + 2.2 + i * 0.18, a + 3.4 + i * 0.18)))));
    stageEl.style.background = "#FFFFFF";
  }
  // 3. ink blooms into hanji
  if (within(t, "ink", 0.6)) {
    const a = S0("ink");
    const sc = SCENES.meok(t, null, { once: true });
    sc.p = [clamp((t - a - 0.2) / 3), 0.45, 1, 0]; sc.place = padFor().place;
    sc.mark.rough = 0.22;
    L.meok.draw(t, sc);
    show("meok", Math.min(prog(t, a - 0.5, a), 1 - prog(t, S1("ink") - 0.05, S1("ink") + 0.45)));
  }
  // 4. stone: a wipe in, the light walks across
  if (within(t, "stone", 0.6)) {
    const a = S0("stone");
    const sc = SCENES.quiet(t, null); sc.place = padFor().place;
    const u = ease.inOut(prog(t, a, S1("stone")));
    sc.mouse = [mix(-0.1, 1.05, u), mix(0.3, 0.95, u)];
    sc.p = [0.8, mix(0.1, 0.65, u), 0, 0];
    L.quiet.draw(t, sc);
    const w = ease.inOut(prog(t, a - 0.5, a + 0.1));
    L.quiet.el.style.clipPath = `inset(0 0 0 ${(1 - w) * 100}%)`;
    show("quiet", 1 - prog(t, S1("stone") - 0.05, S1("stone") + 0.45));
  } else L.quiet.el.style.clipPath = "";
  // 5. glaze, then cloth
  if (within(t, "glaze", 0.6)) {
    const a = S0("glaze");
    const sc = SCENES.celadon(t, null); sc.place = padFor().place;
    sc.p = [clamp((t - a) / 2.6), mix(-0.1, 1.2, ease.inOut(prog(t, a + 1.2, S1("glaze") + 0.3))), 0, 0];
    L.celadon.draw(t, sc);
    show("celadon", Math.min(prog(t, a - 0.45, a + 0.05), 1 - prog(t, S1("glaze") - 0.05, S1("glaze") + 0.45)));
  }
  if (within(t, "cloth", 0.6)) {
    const a = S0("cloth");
    const sc = SCENES.bojagi(t, null); sc.place = padFor().place;
    sc.p = [1, mix(0.3, 1, ease.inOut(prog(t, a, a + 2))), 1, 0];
    L.bojagi.draw(t, sc);
    const w = ease.inOut(prog(t, a - 0.5, a + 0.1));
    L.bojagi.el.style.clipPath = `inset(${(1 - w) * 100}% 0 0 0)`;
    show("bojagi", 1 - prog(t, S1("cloth") - 0.05, S1("cloth") + 0.3));
  } else L.bojagi.el.style.clipPath = "";
  // 6. pop: the pieces slap down like stickers, the foil turns
  if (within(t, "pop", 0.6)) {
    const a = S0("pop");
    const sc = SCENES.holo(t, null); sc.place = padFor().place;
    sc.mark.pose = landPose(t - LAND.pop, { step: 0.12, dur: 0.55, drop: 170, spin: 28 });
    const ang = t * 1.4; sc.mouse = [0.5 + 0.42 * Math.cos(ang), 0.5 + 0.35 * Math.sin(ang * 1.3)];
    L.holo.draw(t, sc);
    show("holo", Math.min(prog(t, a - 0.3, a), 1 - prog(t, S1("pop") - 0.05, S1("pop") + 0.35)));
  }
  // 7. the napkin: a pen sketch, and one wink
  if (within(t, "napkin", 0.5)) {
    const a = S0("napkin");
    const o = Math.min(prog(t, a - 0.3, a + 0.1), 1 - prog(t, S1("napkin") - 0.1, S1("napkin") + 0.4));
    napkinBg.style.opacity = o;
    ink.g.setAttribute("fill", "none"); ink.g.setAttribute("stroke", "#2B3A67"); ink.g.setAttribute("stroke-width", "6"); ink.g.setAttribute("stroke-linejoin", "round");
    ink.set({ rough: 0.55, tear: 0.5, seed: 9, pose: wink(t, WINK) });
    ink.show(o); pen.style.opacity = prog(t, a + 0.6, a + 1.2);
    stageEl.style.background = "#FBF8F1";
  } else { ink.g.setAttribute("stroke", "none"); if (!within(t, "dial", 0.6)) ink.g.setAttribute("fill", "#1D1B20"); }
  // 8. all of them, then one
  if (t >= S0("all") - 0.1) {
    const a = S0("all"), gather = ease.inOut(prog(t, B(27) - 0.2, B(27) + 0.8));
    TILE_ORDER.forEach((k, i) => {
      const bx = tileBox(i);
      const pin = ease.back(prog(t, a + i * 0.16, a + i * 0.16 + 0.6), 1.3);
      const s = bx.s * clamp(pin, 0, 1.2);
      const cx = W / 2 - (W * bx.s) / 2, cy = H / 2 - (H * bx.s) / 2;
      place(L[k].el, mix(bx.x, cx, gather) + (W * bx.s) * (1 - clamp(pin, 0, 1)) / 2, mix(bx.y, cy, gather) + (H * bx.s) * (1 - clamp(pin, 0, 1)) / 2, s * (1 - gather * 0.4), 18);
      L[k].draw(t, { ...settled[k](t), ...padFor() });
      show(k, clamp(pin * 2) * (1 - gather));
    });
    // the one mark, clean, in ink
    const fin = prog(t, B(27) + 0.3, B(27) + 1.1);
    if (fin > 0) {
      ink.g.setAttribute("fill", "#1D1B20");
      ink.set({ rough: 0, round: 0.5, pose: landPose(t - LAND.final, { step: 0.1, dur: 0.6, drop: 50, spin: 0 }) });
      ink.show(fin);
    }
    stageEl.style.background = "#FFFFFF";
  }

  inOut(C.six, t, 2.4, S1("sketch") - 0.3);
  inOut(C.cut, t, S0("dial") + 1.4, S1("dial") - 0.4);
  inOut(C.ink, t, S0("ink") + 1.2, S1("ink") - 0.4);
  inOut(C.stone, t, S0("stone") + 1, S1("stone") - 0.4);
  inOut(C.glaze, t, S0("glaze") + 0.6, S1("glaze") - 0.2);
  inOut(C.cloth, t, S0("cloth") + 0.6, S1("cloth") - 0.2);
  inOut(C.pop, t, S0("pop") + 1.2, S1("pop") - 0.4);
  inOut(C.cat, t, S0("napkin") + 1.8, S1("napkin") - 0.3);
  inOut(C.which, t, B(28), 99);
  inOut(url, t, B(28) + 0.5, 99, 10);
  inOut(round, t, B(28) + 0.7, 99, 10);
}

// ---- chapter shorts: the same film, windowed (?chapter=ink)
const chapter = Q.get("chapter");
const T0 = chapter ? CH[chapter][0] : 0;
const DUR = chapter ? CH[chapter][1] - CH[chapter][0] : DURATION;
function render(t) {
  renderAt(T0 + t);
  fade.style.opacity = chapter ? Math.max(1 - prog(t, 0, 0.35), prog(t, DUR - 0.5, DUR)) : prog(t, DUR - 0.6, DUR);
}
window.SCORE = { bpm: BPM, land: { sketch: landTimes(LAND.sketch), pop: landTimes(LAND.pop, { step: 0.12, dur: 0.55 }), final: landTimes(LAND.final, { step: 0.1, dur: 0.6 }) }, wink: WINK };
window.ready = ready().then((ok) => { render(0); return ok; });
window.render = render;
window.DURATION = DUR;
window.POSTER = chapter ? Math.min(DUR - 1, 6) : B(28) + 1.6;
</script></body></html>
